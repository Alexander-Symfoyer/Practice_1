<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Session Complete | FocusFlow</title>
    <link rel="stylesheet" href="session-summary.css" />
  </head>
  <body>
    <main class="summary-page">
      <header class="celebration"><span>🎉</span><h1>Congratulation!</h1><p>You did it!</p></header>
      <section class="summary" aria-labelledby="summary-title"><h2 id="summary-title">Summary</h2><div class="summary-cards">
        <article class="daily card"><div class="chart-icon">▂▅▇↗</div><strong>Daily Progress</strong><b>5:00 / 6.00 hrs</b><div class="progress"><span></span></div><p>Only 16.7% Keep going !</p></article>
        <div class="stat-cards"><article class="stat card"><span>⏱</span><p>Total time<br /><b>97 hrs 30 mins</b></p></article><article class="stat card"><span>◴</span><p>This month<br /><b>34 hrs 15 mins</b></p></article></div>
      </div></section>
      <section class="weekly" aria-labelledby="weekly-title"><h2 id="weekly-title">Weekly Chart</h2><div class="chart"><span class="axis-y">Hrs</span><span class="axis-x">Days</span><div class="bars"><i style="--h: 87px"></i><i style="--h: 129px"></i><i style="--h: 87px"></i><i style="--h: 205px"></i><i style="--h: 163px"></i><i style="--h: 112px"></i><i class="today" style="--h: 205px"><b>5:00</b></i></div><div class="day-labels"><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span></div></div></section>
      <section class="rating" aria-labelledby="rating-title"><h2 id="rating-title">How was your session?</h2><div class="moods"><button>😤</button><button>🙁</button><button>😐</button><button>🙂</button><button>🤩</button></div></section>
      <a class="home-button" href="home.html">‹&nbsp; Back to home</a>
    </main>
  </body>
</html>
